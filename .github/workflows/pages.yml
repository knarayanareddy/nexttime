name: Deploy NextTime Interactive Rehearsal Demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "docs/media/nexttime-demo.webm"
      - "docs/media/nexttime-demo.mp4"
      - "examples/real-world-attempt.example.json"
      - "ui/tokens.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Build static GitHub Pages bundle (base /nexttime/)
        run: |
          pnpm --dir apps/web build
          test -f apps/web/dist/media/nexttime-demo.webm
          test ! -L apps/web/dist/media/nexttime-demo.webm
          test -f apps/web/dist/media/nexttime-demo.mp4
          test ! -L apps/web/dist/media/nexttime-demo.mp4
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
