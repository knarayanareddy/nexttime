[project]
name = "nexttime-domain"
version = "0.1.0"
description = "Deterministic NextTime consent, authentic rubric, Bee bridge, minimization, and API services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "websockets==15.0.1",
]

[project.scripts]
nexttime-bee-bridge = "nexttime_bee_bridge.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "imageio-ffmpeg>=0.6.0",
  "jsonschema[format]==4.25.1",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "playwright>=1.64.1",
  "pytest==9.0.3",
  "pytest-cov==6.3.0",
  "pyyaml>=6.0.3",
  "ruff==0.13.2",
  "types-jsonschema>=4.26.0.20261006",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/nexttime_domain",
  "packages/model-gateway/nexttime_model_gateway",
  "packages/bee-adapter/nexttime_bee_adapter",
  "services/calendar/nexttime_calendar",
  "services/rehearsal/nexttime_rehearsal",
  "services/minimization/nexttime_minimization",
  "services/bee-bridge/nexttime_bee_bridge",
  "services/api/nexttime_api",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = [
  "^apps/web/",
  "^dist/",
  "^build/",
]
mypy_path = [
  "packages/domain",
  "packages/model-gateway",
  "packages/bee-adapter",
  "services/calendar",
  "services/rehearsal",
  "services/minimization",
  "services/bee-bridge",
  "services/api",
  "tests",
]
files = [
  "packages/domain",
  "packages/model-gateway",
  "packages/bee-adapter",
  "services/calendar",
  "services/rehearsal",
  "services/minimization",
  "services/bee-bridge",
  "services/api",
]

[[tool.mypy.overrides]]
module = ["tests.*", "unit.*", "contract.*", "security.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
disable_error_code = ["index", "attr-defined", "no-any-return", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "imageio_ffmpeg.*"]
ignore_missing_imports = true
