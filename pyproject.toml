[project]
name = "nexttime-domain"
version = "0.1.0"
description = "Deterministic NextTime consent, authentic rubric, and skill-state foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "jsonschema[format]==4.25.1",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.3.0",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/nexttime_domain",
  "packages/model-gateway/nexttime_model_gateway",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/domain", "packages/model-gateway"]
