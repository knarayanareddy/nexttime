[project]
name = "nexttime-domain"
version = "0.1.0"
description = "Deterministic NextTime consent, authentic rubric, Bee bridge, minimization, and API services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "websockets==15.0.1",
]

[project.scripts]
nexttime-bee-bridge = "nexttime_bee_bridge.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema[format]==4.25.1",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==6.3.0",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/nexttime_domain",
  "packages/model-gateway/nexttime_model_gateway",
  "packages/bee-adapter/nexttime_bee_adapter",
  "services/calendar/nexttime_calendar",
  "services/rehearsal/nexttime_rehearsal",
  "services/minimization/nexttime_minimization",
  "services/bee-bridge/nexttime_bee_bridge",
  "services/api/nexttime_api",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = [
  "packages/domain",
  "packages/model-gateway",
  "packages/bee-adapter",
  "services/calendar",
  "services/rehearsal",
  "services/minimization",
  "services/bee-bridge",
  "services/api",
]
files = [
  "packages/domain",
  "packages/model-gateway",
  "packages/bee-adapter",
  "services/calendar",
  "services/rehearsal",
  "services/minimization",
  "services/bee-bridge",
  "services/api",
]
